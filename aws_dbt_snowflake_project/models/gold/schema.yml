version: 2

models:
  - name: fact
    description: One row per booking with measures and surrogate keys to the SCD2 dimensions.
    columns:
      - name: BOOKING_ID
        data_tests:
          - not_null
          - unique

      - name: DIM_BOOKINGS_SK
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bookings')
                field: dbt_scd_id

      - name: DIM_LISTINGS_SK
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: dbt_scd_id

      - name: DIM_HOST_SK
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_host')
                field: dbt_scd_id